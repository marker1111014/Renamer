[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "renamer"
version = "1.0.0"
description = "現代且安全可靠的桌面批次檔案重新命名工具 (PyQt5)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "PyQt5>=5.15.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pyinstaller>=6.0.0",
]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --tb=short"
